<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dishelp</title>
  <meta name="description" content="Dishelp - Trouve des recettes adaptées à ton régime alimentaire et à ton garde-manger.">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />

  <!-- Google Fonts (si utilisées) -->
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&display=swap" rel="stylesheet">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#67db8c" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
</head>

<body>

  <aside id="menu" role="navigation" aria-label="Menu secondaire" aria-hidden="true">
    <ul id="burger-content"></ul>
  </aside>

  <button id="toggleBtn" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>

  <div class="app">

    <header class="header">
      <h1>Dishelp</h1>

      <nav class="menu" aria-label="Navigation principale">
        <button class="menu-btn active" data-target="home">Accueil</button>
        <button class="menu-btn" data-target="favorites">Favoris</button>
        <button class="menu-btn" data-target="pantry">Garde-manger</button>
        <button class="menu-btn" data-target="profile">Profil</button>
      </nav>
    </header>

    <main id="content" class="content" role="main"></main>

  </div>

  <script src="database.js" defer></script>
  <script src="app.js" defer></script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js');
    });
  }
  </script>

</body>
</html>
